<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" fill="none">
  <!-- Antenna -->
  <line x1="50" y1="8" x2="50" y2="28" stroke="#32373d" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Router body -->
  <rect x="18" y="28" width="64" height="32" rx="6" ry="6" stroke="#32373d" stroke-width="3.5" fill="none"/>

  <!-- Inner shelf line -->
  <line x1="18" y1="46" x2="82" y2="46" stroke="#32373d" stroke-width="3" stroke-linecap="round"/>

  <!-- Dots (LEDs) -->
  <circle cx="30" cy="37" r="2.5" fill="#32373d"/>
  <circle cx="39" cy="37" r="2.5" fill="#32373d"/>
  <circle cx="48" cy="37" r="2.5" fill="#32373d"/>
  <circle cx="57" cy="37" r="2.5" fill="#32373d"/>

  <!-- Base / feet -->
  <line x1="30" y1="60" x2="30" y2="70" stroke="#32373d" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="70" y1="60" x2="70" y2="70" stroke="#32373d" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="24" y1="70" x2="76" y2="70" stroke="#32373d" stroke-width="3.5" stroke-linecap="round"/>
</svg>