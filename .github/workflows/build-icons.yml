name: Build Icons

on:
  push:
    paths:
      - "svg/**"
      - "tenant_svgs/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    env:
      ICON_REPO_OWNER: miteshb-eazyiot
      ICON_REPO_NAME: eazyicons

    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - run: npm install

      # 🟢 STEP 1 — BUST JSDELIVR CACHE IMMEDIATELY
      - name: Set release tag
        run: echo "TAG=${{ github.sha }}" >> "$GITHUB_ENV"

      # 🟢 STEP 2 — Generate CSS (and optimize Icons)
      - name: Generate CSS
        run: node scripts/generate-css.js
        env:
          TAG: ${{ env.TAG }}

      # 🟢 STEP 3 — WAIT FOR CDN (Check any file to verify propagation)
      - name: Wait for jsDelivr
        run: |
          # Find a representative file to check CDN propagation
          FILE=$(find svg tenant_svgs -name "*.svg" | head -n 1)

          if [ -z "$FILE" ]; then
            echo "No icons to check"
            exit 0
          fi

          echo "Checking CDN for $FILE"

          for i in {1..15}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://cdn.jsdelivr.net/gh/${{ env.ICON_REPO_OWNER }}/${{ env.ICON_REPO_NAME }}@${TAG}/$FILE")

            if [ "$STATUS" = "200" ]; then
              echo "CDN ready"
              exit 0
            fi

            echo "Waiting ($i) for $STATUS..."
            sleep 3
          done

          echo "CDN not fully ready, continuing anyway"

      # 🟢 STEP 4 — Commit Changes (CSS + Optimized Icons)
      - name: Commit Changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add *.css svg/ tenant_svgs/ || echo "Nothing to add"
          git commit -m "auto: sync icons and CSS [skip ci]" || echo "No changes"
          git push origin HEAD

      # 🟢 STEP 5 — Deploy
      - name: Upload icons.css to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
